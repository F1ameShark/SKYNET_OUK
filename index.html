<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мониторинг ОУК и SA</title>
<link rel="icon" type="image/png" sizes="192x192" href="web-app-manifest-192x192.png">
<link rel="manifest" href="manifest.json">
<!-- Подключаем собственный локальный файл Excel из репозитория. CORS и сбои сети больше не страшны! -->
<script src="xlsx.full.js"></script>
<link rel="stylesheet" href="style.css">
<style>
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:10px;}
.modal-content{background:var(--card-bg);width:95%;max-width:900px;max-height:90vh;padding:25px;border-radius:12px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);overflow-y:auto;position:relative;}
.modal-close{position:absolute;top:15px;right:15px;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-muted);line-height:1;}
.modal-close:hover {color:var(--text-main);}
.user-management-table,.detail-calls-table{width:100%;border-collapse:collapse;margin-top:15px;font-size:0.9rem;color:var(--text-main);}
.user-management-table th,.user-management-table td,.detail-calls-table th,.detail-calls-table td{padding:10px;border:1px solid var(--border);text-align:left;}
.user-management-table th,.detail-calls-table th{background-color:var(--table-th-bg);color:var(--text-muted);font-weight:700;text-transform:uppercase;font-size:0.75rem;}
.sm-input,.sm-select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;background:var(--input-bg);color:var(--text-main);outline:none;}
.btn-sm{padding:6px 10px;font-size:0.8rem;border-radius:4px;margin-right:5px;}
.theme-switch-wrapper{display:flex;align-items:center;gap:15px;margin-bottom:25px;padding-bottom:15px;border-bottom:1px solid var(--border);}
.theme-switch-label{font-size:1rem;font-weight:600;color:var(--text-main);}
</style>
<script>
const savedTheme=localStorage.getItem('site-theme');
if(savedTheme==='dark')document.documentElement.setAttribute('data-theme','dark');
</script>
</head>
<body>
<div class="container">
<div id="authScreen" class="auth-container">
<div class="site-logo-container" style="margin-bottom:25px;">
<img src="web-app-manifest-192x192.png" alt="Logo" class="site-logo-img">
<div class="site-logo-text">ORDA</div>
</div>
<h2>Вход в систему</h2>
<div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="example@company.com"></div>
<div class="form-group"><label>Пароль</label><input type="password" id="loginPassword" placeholder="******"></div>
<button class="btn" id="loginBtn" style="width:100%;">Войти</button>
<p id="authError" style="color:var(--danger);font-size:0.85rem;margin-top:10px;text-align:center;"></p>
</div>
<div id="mainScreen" class="hidden">
<div class="navbar">
<div class="site-logo-container">
<img src="web-app-manifest-192x192.png" alt="Logo" class="site-logo-img">
<div class="site-logo-text">ORDA <span>ПОРТАЛ</span></div>
</div>
<div class="nav-user">
<strong id="userDisplayName">-</strong> 
<span id="userRoleBadge" style="font-size:0.8rem;padding:2px 8px;background:var(--border);color:var(--text-main);border-radius:10px;">-</span>
</div>
<div class="nav-buttons">
<button class="btn hidden" id="openUsersModalBtn" style="background:#3182ce;">👥 Управление пользователями</button>
<button class="btn" id="toggleSettingsBtn" style="background:#4a5568;">⚙️ Настройки</button>
<button class="btn btn-danger" id="logoutBtn">Выйти</button>
</div>
</div>
<div id="settingsPanel" class="modal-overlay hidden">
<div class="modal-content" style="max-width:500px;">
<button class="modal-close" id="closeSettingsModalBtn">&times;</button>
<h3 style="margin-bottom:20px;color:var(--text-main);">⚙️ Настройки и безопасность</h3>
<div class="theme-switch-wrapper">
<span class="theme-switch-label">Включить тёмную тему</span>
<button class="btn" id="themeToggleBtn" style="padding:8px 14px;font-size:0.9rem;background:var(--primary);">🌙 Выкл</button>
</div>
<h4 style="margin-bottom:10px;font-size:0.95rem;color:var(--text-muted);">Сменить личный пароль:</h4>
<div class="form-group" style="margin-bottom:12px;">
<input type="password" id="newPassword" placeholder="Новый пароль (минимум 6 символов)">
</div>
<button class="btn" id="changePasswordBtn" style="width:100%;margin-bottom:10px;">Обновить пароль</button>
<p id="settingsMessage" style="font-size:0.9rem;font-weight:600;text-align:center;"></p>
</div>
</div>
